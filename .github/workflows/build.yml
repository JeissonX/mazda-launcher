name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build MazdaOS APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "cmdline-tools;latest platform-tools platforms;android-33 build-tools;33.0.2"

      - name: Build MazdaOS APK
        env:
          BUILD_TOOLS: "33.0.2"
        run: chmod +x build.sh && ./build.sh

      - name: Upload MazdaOS APK
        uses: actions/upload-artifact@v4
        with:
          name: MazdaOS-APK
          path: build/MazdaOS.apk
          retention-days: 30
          if-no-files-found: error
